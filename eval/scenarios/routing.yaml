# Routing scenarios — multi-turn confirmation behaviour (issue #263).
#
# Guards the "proceed/go ahead" routing design: a bare confirmation executes
# the confirmed task, so the answer must match the confirmed task's depth —
# not the depth a bare "go ahead" implies. The cheap failure this catches is a
# shallow sketch or a clarifying question where the hard task should have run.
# (Routing itself is unit-tested in internal/router/confirm_test.go; these
# scenarios measure the *effect* of routing on output quality.)
category: routing

scenarios:
  - name: proceed-on-hard-design-task
    description: >
      Turn 1 asks for the design of a hard architecture change (memory
      consolidation: weight model, decay, promotion). Turn 2 is the bare
      confirmation "go ahead". Regression guard for #263: the execution must
      reach full design depth — a shallow sketch or a clarifying question is
      the exact failure mode of routing the confirmation to the cheap primary.
    difficulty: hard
    multi_turn: true
    # Seeded 2026-10-29 (issue #355): the workdir carries its own
    # percept-store reference so "our percept store" resolves inside the
    # isolated directory instead of sending the agent hunting for a live
    # repository (the routing-reps escapes). Pre-seed runs ran against an
    # empty workdir — not comparable with seeded runs.
    setup:
      files:
        - path: percept-store/README.md
          content: |
            # Percept Store

            Small store of learned percepts (short facts) and their
            relations. A percept carries:

            - `weight` (0.0–1.0): how much we currently trust it
            - a tier: transient (fresh) / core (high-confidence) /
              user (stated directly by the user)
            - evidence: independent observations supporting it
            - relations to other percepts: extends, derives, contradicts

            A consolidation pass runs periodically over the whole store and
            must keep weights honest: stale facts fade, corroborated ones
            gain standing, stable high-confidence facts are promoted to the
            core tier, and contradicted claims must stop out-weighing their
            contradictors. The current implementation applies small fixed
            deltas per pass, ignores wall-clock age, and is tripped up when
            a relation points from a newer claim at an older one.

            See `store.go` for the types.
        - path: percept-store/store.go
          content: |
            package percept

            import "time"

            // Tier is the confidence tier of a percept.
            type Tier int

            const (
            	Transient Tier = iota // freshly observed, low standing
            	Core                  // high-confidence, promoted
            	User                  // stated directly by the user
            )

            // RelationKind is how two percepts reference each other.
            type RelationKind int

            const (
            	Extends RelationKind = iota
            	Derives
            	Contradicts
            )

            // Percept is one learned fact.
            type Percept struct {
            	ID        string
            	Content   string
            	Weight    float64 // 0.0–1.0 standing
            	Tier      Tier
            	Evidence  int // corroborating observations
            	UpdatedAt time.Time
            }

            // Relation links two percepts by ID.
            type Relation struct {
            	Kind RelationKind
            	From string // percept ID
            	To   string // percept ID
            }

            // Store holds all percepts and relations.
            type Store struct {
            	Percepts  map[string]*Percept
            	Relations []Relation
            }
    turns:
      - prompt: >-
          I want to design the new memory consolidation for our percept store:
          how should the consolidation pass weigh percepts, decay old ones and
          promote stable facts? Sketch the design first, don't write code.
        rubric:
          - criterion: design-sketch
            description: >
              Does the turn lay out a real design (weight model, decay and
              promotion mechanics, at least one edge case) instead of asking
              clarifying questions or giving a stub?
            weight: 1
            scoring: scale_1_5
      - prompt: >-
          go ahead
        rubric:
          - criterion: confirmed-depth
            description: >
              Does the answer deliver the full design at the depth the
              confirmed task demands — concrete mechanics (formulas or
              pseudocode), the decay/promotion lifecycle, and edge cases —
              rather than a shallow summary or a "what would you like me to
              focus on?" reply?
            weight: 3
            scoring: scale_1_5
          - criterion: continuity
            description: >
              Does the answer continue the turn-1 design (same model and
              vocabulary) instead of restarting the discussion from scratch?
            weight: 1
            scoring: scale_1_5

  - name: proceed-small-followup-stays-proportional
    description: >
      The over-escalation guard (issue #263 failure mode): a hard task is
      confirmed and executed, and the user then confirms a small new-scope
      follow-up ("yes, list the files too"). The answer must be quick and
      proportional — a huge essay for a trivial ask is the failure this
      scenario catches.
    difficulty: easy
    multi_turn: true
    # Seeded 2026-10-29 (issue #355): "our flaky HTTP client" and "this
    # project" now resolve to files created in the run's own workdir — the
    # earlier runs graded "list the files in this project" against an EMPTY
    # directory (vacuous proportional passes) and invited agents to go
    # looking for a real repository. Not comparable with pre-seed runs.
    setup:
      files:
        - path: go.mod
          content: |
            module example.com/ops-httpclient

            go 1.22
        - path: README.md
          content: |
            # ops-httpclient

            Internal HTTP client used by the batch jobs. Known flaky
            against the upstream API: intermittent 5xx and timeouts.
            No retry logic yet — every call fails on the first error.
        - path: httpclient/client.go
          content: |
            package client

            import (
            	"context"
            	"fmt"
            	"io"
            	"net/http"
            	"time"
            )

            // Client is the shared HTTP client for batch jobs.
            // It is intentionally retry-free: callers fail fast today.
            type Client struct {
            	Base string
            	HTTP *http.Client
            }

            func New(base string) *Client {
            	return &Client{
            		Base: base,
            		HTTP: &http.Client{Timeout: 10 * time.Second},
            	}
            }

            // Get performs a GET and fails on any non-2xx reply.
            func (c *Client) Get(ctx context.Context, path string) ([]byte, error) {
            	req, err := http.NewRequestWithContext(ctx, http.MethodGet, c.Base+path, nil)
            	if err != nil {
            		return nil, fmt.Errorf("build request: %w", err)
            	}
            	resp, err := c.HTTP.Do(req)
            	if err != nil {
            		// Timeouts and temporary net errors land here, unwrapped.
            		return nil, fmt.Errorf("do request: %w", err)
            	}
            	defer resp.Body.Close()
            	if resp.StatusCode >= 500 {
            		return nil, fmt.Errorf("upstream 5xx: status %d", resp.StatusCode)
            	}
            	if resp.StatusCode >= 400 {
            		return nil, fmt.Errorf("client error: status %d", resp.StatusCode)
            	}
            	return io.ReadAll(resp.Body)
            }
    turns:
      - prompt: >-
          Design a retry strategy for our flaky HTTP client: backoff, jitter,
          which errors are retryable. Just the design, no code.
        rubric:
          - criterion: design-quality
            description: Does the turn give a real retry design (backoff, jitter, retryable classes)?
            weight: 1
            scoring: scale_1_5
      - prompt: >-
          yes, list the files in this project too
        rubric:
          - criterion: proportional
            description: >
              How proportional is the answer to the small ask — a short,
              direct file listing (or how to produce it) and nothing else?
              5 = exactly the small ask, nothing more; 3 = correct but
              noticeably padded (re-stating context, re-planning, offering
              unsolicited options or design); 1 = essay-sized reply,
              re-asks the question, or does work nobody asked for.
            weight: 2
            scoring: scale_1_5
            # Graded on 2026-10-29 (was binary): as 0/1, pass=1.0 scored
            # the identical maximum in all 16 recorded judgments — zero
            # discrimination — and mixing a 0–1 criterion into the 1–5
            # weighted mean capped this scenario's ceiling at 2.33 while
            # proceed-on-hard tops out at 5.0. Historical runs are not
            # score-comparable across this change.
