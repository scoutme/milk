    turns:
      - prompt: >
          We want an auditable order event log. Before writing any code,
          sketch a brief implementation plan (which packages and files you
          expect to touch and why), then implement it.

          New package `internal/events` with exactly this surface:

          - `type Event struct { Seq uint64; Kind string; Ref string; Detail map[string]string }`
          - `type Log struct` — an in-memory, append-only event log (no
            mutation or deletion API).
          - `func (l *Log) Append(kind, ref string, detail map[string]string) Event`
            — appends one event and returns it; `Seq` starts at 1 and
            increases by exactly 1 per append; a nil `Detail` is allowed.
          - `func (l *Log) All() []Event` — every event in `Seq` order, as a
            defensive copy (mutating the result must not affect the log).
          - `func (l *Log) Filter(kind string) []Event` — events of the given
            kind, in `Seq` order, defensive copy.

          Wiring in `internal/service`:

          - `func (s *Service) SetEventLog(l *events.Log)` and
            `func (s *Service) EventLog() *events.Log`.
          - A successful `ConfirmOrder` appends exactly one event: `Kind`
            "confirmed", `Ref` = the order reference.
          - With no event log set, everything must keep working exactly as
            today (nil-safe). Do not change the constructor `New`, and do
            not modify or delete the existing tests.
          - Wire the event log in `cmd/server` alongside the other
            collaborators.

          Tests: add `internal/events/log_test.go` and extend the service
          tests in the existing suite style, covering at least `Seq`
          continuity/order, `Filter`, defensive copies, nil `Detail`, and
          the confirmed event. Finish by running `go test ./...` from the
          repo root and paste the output.
        rubric:
          - criterion: planning
            description: >
              Does the response sketch a coherent implementation plan
              (packages/files to touch and why) before coding, and does the
              delivered code follow it? Reward a plan that covers the
              cross-package touch points (new events package, service
              wiring, cmd/server, tests) and survives contact with the
              code (no major silent rework). Penalize jumping straight to
              code or a plan the implementation contradicts.
            weight: 2
            scoring: scale_1_5
          - criterion: api_adherence
            description: >
              Binary. The mandated surface exists with the mandated
              semantics: Event struct with Seq/Kind/Ref/Detail; Log.Append
              assigns Seq starting at 1, contiguous (+1 per append), and
              returns the event; All() returns every event in Seq order as
              a defensive copy; Filter(kind) returns matching events in Seq
              order as a defensive copy; the log exposes no mutation or
              deletion API.
            weight: 3
            scoring: binary
          - criterion: service_wiring
            description: >
              Binary. Service gains SetEventLog/EventLog; each successful
              ConfirmOrder appends exactly one event (Kind "confirmed",
              Ref = the order ref); with no event log set nothing breaks
              (nil-safe); New is unchanged and the existing service tests
              are unmodified and green; cmd/server wires the event log
              alongside the other collaborators.
            weight: 2
            scoring: binary
          - criterion: new_tests
            description: >
              Are the new tests in the existing suite style and do they
              cover Seq continuity/order, Filter, defensive copies, nil
              Detail, and the service confirmed event? Reward tests that
              would fail against a wrong implementation (e.g. checking
              defensive-copy semantics by mutating the returned slice).
            weight: 2
            scoring: scale_1_5
          - criterion: suite_green
            description: >
              Binary. The response reports a backed `go test ./...` run
              (output pasted) that is green.
            weight: 2
            scoring: binary
      - prompt: >
          Requirements update — persistence. The log must survive restarts
          as JSONL:

          - `func (l *Log) Save(path string) error` — writes one JSON object
            per line (fields Seq/Kind/Ref/Detail), creating parent
            directories as needed.
          - `func Load(path string) (*Log, error)` — strict reader.
            Save→Load must round-trip `Seq`, `Kind` and `Ref` exactly, and a
            nil `Detail` must load back as an empty (non-nil) map. `Seq`
            must start at 1 and be contiguous — a gap is an exported error
            `ErrSeqGap` (usable with errors.Is). A line that is not a valid
            JSON event is an exported error `ErrTruncated`. A missing file
            returns the underlying filesystem error.
          - The service must flush the log to `data/events.jsonl` after
            every successful `ConfirmOrder` (parent dirs created as
            needed). A flush failure must not crash the service or corrupt
            state silently — surface it (return it from ConfirmOrder or log
            it clearly) and say in your report which you chose.

          Everything from the previous turn keeps working: don't break the
          existing API or tests. Add tests covering the new behavior
          (round-trip, gap rejection, truncation rejection, flush), then
          run `go test ./...` and paste the output.
        rubric:
          - criterion: persistence
            description: >
              Binary. Save writes one JSON object per line and creates
              parent directories; Load round-trips Seq/Kind/Ref exactly and
              maps a nil Detail to an empty non-nil map; Save→Load of a log
              containing a nil-Detail event preserves everything per spec.
            weight: 3
            scoring: binary
          - criterion: validation
            description: >
              Binary. ErrSeqGap and ErrTruncated are exported and
              errors.Is-comparable; Load returns ErrSeqGap when Seq does
              not start at 1 or has a gap; Load returns ErrTruncated for a
              line that is not a valid JSON event; Load on a missing file
              surfaces the underlying filesystem error (not ErrTruncated
              and not an empty log).
            weight: 2
            scoring: binary
          - criterion: flush_wiring
            description: >
              Binary. After every successful ConfirmOrder the log is
              flushed to data/events.jsonl (parent dirs created as needed);
              a flush failure does not crash or silently corrupt state and
              is surfaced (returned from ConfirmOrder or logged clearly —
              either acceptable, the response must say which).
            weight: 2
            scoring: binary
          - criterion: iteration_discipline
            description: >
              How well does the agent iterate on its own previous work?
              Reward extending the turn-1 design (same API, same style)
              with minimal churn: turn-1 tests still green and unmodified
              except additions, no gratuitous rewrite of the events
              package or service, changes scoped to what the new
              requirements need. Penalize large rewrites, renamed
              previously-mandated API, or deleted/weakened earlier tests.
            weight: 2
            scoring: scale_1_5
          - criterion: suite_green
            description: >
              Binary. The response reports a backed `go test ./...` run
              (output pasted) that is green.
            weight: 2
            scoring: binary
      - prompt: >
          Ops needs crash recovery, and it must be forgiving about torn
          writes but nothing else:

          - `func Recover(path string) (*Log, error)` — like `Load`, except
            a TRUNCATED FINAL LINE (a partial write at the tail) is dropped
            silently and the valid events are returned. A missing file is
            not an error: return an empty log. Everything `Load` rejects (a
            gap in Seq, malformed content that is not a truncated final
            line) `Recover` also rejects with the same errors.
          - The recovered log must continue seamlessly: appending after
            `Recover` continues the Seq after the last recovered event.
          - `Load` stays strict — do not relax it.
          - `func (s *Service) RestoreFrom(path string) error` — startup
            recovery: `Recover` the file and install the recovered log as
            the service's event log (replacing any current one). Wire it in
            `cmd/server` before serving, against `data/events.jsonl` (a
            missing file must simply give an empty log).

          A sample crash capture from ops is at `data/capture.jsonl`: 23
          lines where the last one is truncated. Recovering it must yield
          exactly 22 events with Seq 1–22, and the next `Append` must get
          Seq 23. Write a test against that file.

          Update the rest of the tests as needed, run `go test ./...` and
          paste the output.
        rubric:
          - criterion: recovery
            description: >
              Binary. Recover drops a truncated final line silently and
              returns the valid events; a missing file yields an empty log
              and nil error; Recover(data/capture.jsonl) yields exactly 22
              events with Seq 1-22 and the next Append gets Seq 23; a gap
              or mid-file malformed content is still rejected with the
              same errors as Load.
            weight: 3
            scoring: binary
          - criterion: strict_load
            description: >
              Binary. Load remains strict after the change: a truncated
              final line is still ErrTruncated (not silently dropped), gaps
              are still ErrSeqGap; the strict/lenient split is a real
              behavioral distinction, not two names for one implementation.
            weight: 2
            scoring: binary
          - criterion: restore_wiring
            description: >
              Binary. Service.RestoreFrom(path) error exists, installs the
              recovered log as the service's event log (replacing any
              current one) and continues Seq; cmd/server calls it against
              data/events.jsonl before serving; a missing file simply gives
              an empty log (startup must not fail on a fresh deploy).
            weight: 2
            scoring: binary
          - criterion: tests_and_verification
            description: >
              Do the tests cover recovery vs strictness against the planted
              capture file (22-of-23, Seq 23 continuation) and the
              Load/Recover distinction? Does the response report a backed
              `go test ./...` run (output pasted)?
            weight: 2
            scoring: scale_1_5
          - criterion: suite_green
            description: >
              Binary. The final `go test ./...` run reported in the
              response is green.
            weight: 2
            scoring: binary
